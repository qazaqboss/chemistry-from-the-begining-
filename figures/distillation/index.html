<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Перегонка</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.iso{--ds-liquid:#202428;--ds-liquid-top:#292e33;--ds-water:#181c20;--ds-inner:#1d2023;--ds-glow:#ff5a3c}
.iso[data-theme="light"]{--ds-liquid:#e4e8eb;--ds-liquid-top:#eef1f3;--ds-water:#eaf0f3;--ds-inner:#fbfbfa;--ds-glow:#e5484d}
.iso-page{width:100%;max-width:820px;margin:0 auto;padding:12px}
html.embed .iso-page{max-width:none}
html.embed{color-scheme:normal}
html.embed,html.embed body{background:transparent;overflow:hidden}
.iso-figure{margin:0}
.iso-stage{touch-action:pan-y;outline:none;cursor:ew-resize;-webkit-tap-highlight-color:transparent}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.ds-liquid{fill:var(--ds-liquid);stroke:none}
.ds-liquid-top{fill:var(--ds-liquid-top);stroke:none}
.ds-water{fill:var(--ds-water);stroke:none}
.ds-inner{fill:var(--ds-inner);stroke:none}
.ds-column{stroke-width:1.1}
.ds-glow{fill:none;stroke:var(--ds-glow);stroke-width:1.2;opacity:.85}
.ds-chip{fill:var(--anatomy-paper);stroke:var(--anatomy-mid);stroke-width:.5}
.ds-bubble{fill:var(--ds-liquid-top);stroke:var(--anatomy-mid);stroke-width:.5}
.ds-drop{fill:var(--anatomy-hi);stroke:none;opacity:.55}
.ds-drip{fill:var(--anatomy-hi);stroke:none}
.ds-edge{fill:none;stroke:var(--anatomy-hi);stroke-width:1.25;stroke-linejoin:round}
.ds-void{fill:var(--anatomy-shade-0);stroke:none}
.ds-lamp{fill:var(--ds-glow);opacity:.12;transition:opacity .3s}
.ds-lamp[data-on]{opacity:.95}
@media (max-width:560px){.iso-page{padding:6px}.iso-plate{overflow:hidden}.iso-plate .iso-svg{width:116%;margin:-3% -8% -5%}}

ра пара у отводной трубки</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Холодильник Либиха: вода входит снизу, выходит сверху</span></span><span class="iso-caption">В колбе 100 мл смеси: 70 мл спирта и 30 мл воды. Спирт кипит при 78,4 °C, вода — при 100 °C, а смесь закипает около 80 °C. Пар над ней богаче спиртом, чем жидкость, поэтому первый дистиллят — это примерно 84-процентный спирт. Пар конденсируется в холодильнике и стекает в приёмник. Спирта в колбе становится меньше, и температура кипения постепенно растёт к 100 °C. Если греть слабо, тепло уходит в воздух и смесь не закипает. Время ускорено в 10 раз.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }

    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {

        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });
        const insetTop = inset.map(([x, y]) => iso([x, y, z + height], projection));
        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,
        outline: outline.join(""),

{
// Simple distillation of an ethanol–water mixture: a small pure model.
// The pot is heated, warms up to the bubble point of the mixture and boils; the vapour is richer in
// ethanol than the liquid (vapour–liquid equilibrium at 101,3 kPa), so the first distillate is mostly
// alcohol, the pot gets poorer in alcohol and its boiling point climbs toward 100 °C.
// Everything the figure shows (thermometer, levels, drops, readout) is computed from here.

const MIX = {
  ethanol: 70, // mL of ethanol in the flask at the start
  water: 30, // mL of water
  vE: 58.4, // mL/mol, molar volume of ethanol at 20 °C
  vW: 18.07, // mL/mol, water
  hE: 38600, // J/mol, heat of vaporisation of ethanol
  hW: 40700, // J/mol, water
  heatCap: 340, // J/K, the liquid with the glass of the flask
  loss: 1.1, // W/K lost to the room
  ambient: 20, // °C
  maxPower: 260, // W, the hotplate at full
  lag: 7, // s, how long the condensate takes through the condenser
  minLeft: 12, // mL, the hotplate is switched off before the flask runs dry
  speed: 10, // the figure runs 10x faster than the real still
};

// Ethanol–water at 101,3 kPa: mole fraction of ethanol in the liquid x, in the vapour y, boiling point T.
const VLE = [
  [0, 0, 100],
  [0.019, 0.17, 95.5],
  [0.0721, 0.3891, 89.0],
  [0.0966, 0.4375, 86.7],
  [0.1238, 0.4704, 85.3],
  [0.1661, 0.5089, 84.1],
  [0.2337, 0.5445, 82.7],
  [0.2608, 0.558, 82.3],
  [0.3273, 0.5826, 81.5],
  [0.3965, 0.6122, 80.7],
  [0.5079, 0.6564, 79.8],
  [0.5198, 0.6599, 79.7],
  [0.5732, 0.6841, 79.3],
  [0.6763, 0.7385, 78.74],
  [0.7472, 0.7815, 78.41],
  [0.8943, 0.8943, 78.15],
  [1, 1, 78.3],
];

function vle(x, column) {
  for (let i = 1; i < VLE.length; i++) {
    const a = VLE[i - 1];
    const b = VLE[i];
    if (x <= b[0]) return a[column] + ((b[column] - a[column]) * (x - a[0])) / (b[0] - a[0]);
  }
  return VLE[VLE.length - 1][column];
}
const vapourOf = (x) => vle(Math.min(1, Math.max(0, x)), 1);
const boilingOf = (x) => vle(Math.min(1, Math.max(0, x)), 2);

function freshStill() {
  return {
    T: MIX.ambient, // °C of the liquid in the flask
    th: MIX.ambient, // °C the thermometer shows (vapour at the side arm)
    plate: MIX.ambient, // °C of the hotplate disc
    nE: MIX.ethanol / MIX.vE,
    nW: MIX.water / MIX.vW,
    pE: 0, // condensate on its way through the condenser, mol
    pW: 0,
    dE: 0, // collected in the receiver, mol
    dW: 0,
    boiling: false,
    flow: 0, // mL/s of distillate leaving the adapter (figure time)
  };
}

const potVolume = (s) => s.nE * MIX.vE + s.nW * MIX.vW;
const collected = (s) => s.dE * MIX.vE + s.dW * MIX.vW;
const alcoholShare = (s) => (collected(s) > 0.01 ? (s.dE * MIX.vE) / collected(s) : 0);

// One step. power is 0..1 of the hotplate, dt is seconds of figure time.
function stepStill(s, power, dt) {
  const h = dt * MIX.speed;
  const out = { ...s };
  const left = potVolume(s);
  const watts = left > MIX.minLeft ? power * MIX.maxPower : 0;
  // the hotplate disc follows its power (glow), the pot gets what the disc gives
  out.plate = s.plate + (MIX.ambient + watts * 0.9 - s.plate) * (1 - Math.exp(-h / 40));
  const x = s.nE / (s.nE + s.nW);
  const tb = boilingOf(x);
  const net = watts - MIX.loss * (s.T - MIX.ambient);
  if (s.T < tb - 0.01 || net <= 0) {
    out.T = Math.min(tb, s.T + (net * h) / MIX.heatCap);
    out.boiling = false;
  } else {
    const y = vapourOf(x);
    const n = Math.min((net * h) / (y * MIX.hE + (1 - y) * MIX.hW), (s.nE + s.nW) * 0.2);
    out.nE = Math.max(0, s.nE - y * n);
    out.nW = Math.max(0, s.nW - (1 - y) * n);
    out.pE = s.pE + y * n;
    out.pW = s.pW + (1 - y) * n;
    out.T = boilingOf(out.nE / (out.nE + out.nW || 1));
    out.boiling = true;
  }
  // the thermometer bulb sits in the vapour at the side arm: it reads the boiling point while vapour
  // reaches it, and only a little of the pot's warmth before that
  const want = out.boiling ? out.T : MIX.ambient + (out.T - MIX.ambient) * 0.12;
  out.th = s.th + (want - s.th) * (1 - Math.exp(-h / (out.boiling ? 9 : 30)));
  // condensate runs through the condenser and drips into the receiver
  const pass = 1 - Math.exp(-h / MIX.lag);
  const fE = s.pE * pass;
  const fW = s.pW * pass;
  out.pE = out.pE - fE;
  out.pW = out.pW - fW;
  out.dE = s.dE + fE;
  out.dW = s.dW + fW;
  out.flow = dt > 0 ? (fE * MIX.vE + fW * MIX.vW) / dt : 0;
  return out;
}

// Cumulative volume table for a body of revolution given as [z, r] knots (r of the inside).
function volumeTable(profile, from, step = 0.25) {
  const radiusAt = (z) => {
    for (let index = 1; index < profile.length; index++) {
      const [z0, r0] = profile[index - 1];
      const [z1, r1] = profile[index];
      if (z <= z1) return r0 + ((r1 - r0) * (z - z0)) / (z1 - z0 || 1);
    }
    return profile[profile.length - 1][1];
  };
  const top = profile[profile.length - 1][0];
  const rows = [[from, 0]];
  let volume = 0;
  for (let z = from; z < top; z += step) {
    const r = radiusAt(z + step / 2);
    volume += Math.PI * r * r * step;
    rows.push([z + step, volume]);
  }
  return rows;
}

function levelFor(table, volume) {
  if (volume <= 0) return table[0][0];
  for (let index = 1; index < table.length; index++) {
    const [z0, v0] = table[index - 1];
    const [z1, v1] = table[index];
    if (volume <= v1) return z0 + ((z1 - z0) * (volume - v0)) / (v1 - v0 || 1);
  }
  return table[table.length - 1][0];
}

const volumeAt = (table, z) => {
  for (let index = 1; index < table.length; index++) {
    const [z0, v0] = table[index - 1];
    const [z1, v1] = table[index];
    if (z <= z1) return v0 + ((v1 - v0) * (z - z0)) / (z1 - z0 || 1);
  }
  return table[table.length - 1][1];
};

const comma = (value, digits) => value.toFixed(digits).replace(".", ",");

function readoutOf(s) {
  const ml = collected(s);
  const share = ml > 0.05 ? `спирта ${Math.round(alcoholShare(s) * 100)} %` : "спирта —";
  return `t ${comma(s.th, 1)} °C · собрано ${comma(ml, 1)} мл · ${share}`;
}

// Geometry shared by the build and the page: the numbers that place every part, and the few shapes
// that change while the figure runs (liquid in the flask and the receiver, thermometer column,
// hotplate knob pointer, glow). The page inlines this file with its import and export words stripped,
// so it may only use `iso`.


const RING = 40;
const TILT = (14 * Math.PI) / 180;

const GEO = {
  azimuth: 60,
  plate: { x: -122, y: -56, w: 290, d: 108, r: 8 },
  hot: { plan: { x: -94, y: -30, w: 68, d: 60, r: 4 }, z0: 4, z1: 26, disc: 21, discTop: 29, front: 30 },
  knob: { x: -79, z: 14, face: 35.4, span: 135, ring: 3.6 },
  flask: { c: [-60, 0, 54], R: 24, r: 23.2, neck: 5.4, neckIn: 4.6, neckTop: 124 },
  stopper: [124, 130],
  therm: { bulb: [95, 103], r: 2.3, zero: 136, k: 0.6, top: 206 },
  // the side arm, condenser and adapter all lie on one axis tilted down by 14° from the neck at z 106
  axis: { o: [-60, 0, 106], u: [Math.cos(TILT), 0, -Math.sin(TILT)], tilt: TILT },
  arm: { r: 2.4, s0: 5, s1: 31 },
  sleeve: [[26, 36], [170, 180]],
  inner: { r: 2.3, s0: 31, s1: 176 },
  jacket: { s0: 40, s1: 156, R: 8, neck: 3.2, taper: 7 },
  nipples: { out: 52, in: 144 },
  clampAt: 98,
  rods: { flask: [-60, -44], cond: [32, -44] },
  recv: { c: [124, 0], lip: 46 },
  tip: [124, 0, 51],
  water: { y: 31, block: 7 },

const along = (s) => {
  const { o, u } = GEO.axis;
  return [o[0] + u[0] * s, o[1] + u[1] * s, o[2] + u[2] * s];
};

const sphereAt = (z, r) => Math.sqrt(Math.max(0, r * r - (z - GEO.flask.c[2]) ** 2));

// Inside of the flask, [z, r] from the bottom up into the neck.
const FLASK_INSIDE = (() => {
  const { c, r, neckIn } = GEO.flask;
  const bottom = c[2] - r;
  const join = c[2] + Math.sqrt(r * r - neckIn * neckIn);
  const rows = [[bottom, 0.01]];
  for (let z = Math.ceil(bottom); z < join; z += 1) rows.push([z, sphereAt(z, r)]);
  rows.push([join, neckIn], [GEO.flask.neckTop, neckIn]);
  return rows;
})();

// Outside of the receiver (a 100 mL conical flask), as lathe knots [z, r]; the inside is 0.8 thinner.
const RECV_OUT = [
  [0, 0],
  [0, 18.8],
  [0.5, 19.9, 1],
  [1.6, 20.6, 1],
  [2.8, 20.7],
  [29.6, 7.6, 1],
  [31.6, 6.6, 1],
  [33.2, 6.4],
  [44.4, 6.4],
  [44.4, 0],
];
const RECV_INSIDE = [
  [0.8, 0.01],
  [0.9, 18.6],
  [2.6, 19.8],
  [29.2, 6.9],
  [31.4, 5.8],
  [44.4, 5.6],
];

const r1 = (value) => Math.round(value * 10) / 10;
function elPath(points, closed = false) {
  if (!points.length) return "";
  return "M" + points.map(([x, y]) => `${r1(x)} ${r1(y)}`).join("L") + (closed ? "Z" : "");
}

function elHull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (sorted.length < 3) return sorted;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const point of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0) lower.pop();
    lower.push(point);
  }
  const upper = [];
  for (let index = sorted.length - 1; index >= 0; index--) {
    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0) upper.pop();
    upper.push(point);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

function ringAt(cx, cy, r, z, P, from = 0, to = Math.PI * 2, n = RING, closed = true) {
  const out = [];
  const count = closed ? n : n + 1;
  for (let j = 0; j < count; j++) {
    const t = from + ((to - from) * j) / n;
    out.push(iso([cx + r * Math.cos(t), cy + r * Math.sin(t), z], P));
  }
  return out;
}

function radiusIn(profile, z) {
  for (let index = 1; index < profile.length; index++) {
    const [z0, a] = profile[index - 1];
    const [z1, b] = profile[index];
    if (z <= z1) return a + ((b - a) * (z - z0)) / (z1 - z0 || 1);
  }
  return profile[profile.length - 1][1];
}

// The liquid below `level`: one convex frustum per profile band.
function waterPath(cx, cy, profile, level, P, from = -Infinity) {
  const parts = [];
  for (let index = 1; index < profile.length; index++) {
    const [z0raw] = profile[index - 1];
    if (z0raw >= level) break;
    const [z1raw] = profile[index];
    if (z1raw <= from) continue;
    const z0 = Math.max(z0raw, from);
    const z1 = Math.min(z1raw, level);
    const a = radiusIn(profile, z0);
    const b = radiusIn(profile, z1);
    parts.push(elPath(elHull([...ringAt(cx, cy, a, z0, P), ...ringAt(cx, cy, b, z1, P)]), true));
  }
  return parts.join("");
}

// The liquid surface and its rim: back half faint, front half lit.
function surfaceOf(cx, cy, profile, level, P) {
  const r = radiusIn(profile, level);
  const a = (GEO.azimuth * Math.PI) / 180;
  return {
    top: elPath(ringAt(cx, cy, r, level, P), true),
    front: elPath(ringAt(cx, cy, r, level, P, a - Math.PI / 2, a + Math.PI / 2, 24, false)),
    back: elPath(ringAt(cx, cy, r, level, P, a + Math.PI / 2, a + Math.PI * 1.5, 24, false)),

}

// The thermometer column above the stopper, from the stopper to the reading.
function columnOf(celsius, P) {
  const t = GEO.therm;
  const top = Math.max(GEO.stopper[1] + 0.5, t.zero + celsius * t.k);
  return elPath([iso([-60, 0, GEO.stopper[1]], P), iso([-60, 0, top], P)]);
}

function pointerOf(power, P) {
  const n = GEO.knob;
  const t = ((-n.span + 2 * n.span * power) * Math.PI) / 180;
  const at = (r) => iso([n.x + Math.sin(t) * r, n.face, n.z + Math.cos(t) * r], P);
  return elPath([at(0), at(n.ring)]);
}

const live = { bubbles: [], drops: [], drips: [], emit: 0, dripAcc: 0, dropAcc: 0 };
const drawn = {};
function drawVessel(v, ml) {

const dot = (el, x, y, r) => { el.setAttribute("cx", x.toFixed(1)); el.setAttribute("cy", y.toFixed(1)); el.setAttribute("r", r.toFixed(2)); };
const hide = (el) => { if (el.getAttribute("r") !== "0") el.setAttribute("r", "0"); };
function draw() {

  pointer.setAttribute("d", pointerOf(power, P));

  const g = clamp((s.plate - 90) / 170, 0, 1);
  const gk = g.toFixed(2);
  if (drawn.glow !== gk) { drawn.glow = gk; glow.style.opacity = gk; }
  bubbleDots.forEach((el, i) => { const b = live.bubbles[i]; if (!b) return hide(el); const [x, y] = iso([GEO.flask.c[0] + b.x + Math.sin(b.ph + b.z * 0.3) * 0.5, GEO.flask.c[1] + b.y, b.z], P); dot(el, x, y, b.r * P.scale * 1.26); });
  dropDots.forEach((el, i) => { const d = live.drops[i]; if (!d) return hide(el); const [x, y] = iso(along(d.s).map((v, j) => (j === 2 ? v - 1.3 : v)), P); dot(el, x, y, 0.9 * P.scale * 1.26); });

}
function animate(dt) {

    live.bubbles.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, z: GEO.flask.c[2] - GEO.flask.r + 2 + r * r / 40, r: 0.5 + Math.random() * 0.8, v: 0, ph: Math.random() * 6.3 });
  }
  for (const b of live.bubbles) { b.v = Math.min(b.v + 90 * dt, 30); b.z += b.v * dt; b.r = Math.min(b.r + dt * 0.4, 1.6); }

  for (const d of live.drops) { d.v = Math.min(d.v + 14 * dt, 40); d.s += d.v * dt; }

// ---- tour, input, loop
let touring = !still.matches, phase = "heat", phaseAt = 0, clock = 0, idle = 0, frame = 0, last = 0, visible = false;
function startRefill() { refill = { from: s, t: 0 }; }
function stepRefill(dt) {
  refill.t = Math.min(1, refill.t + dt / 1.6);

  const f = refill.from, z = freshStill();
  const mix = (a, b) => a + (b - a) * e;
  s = { ...s, nE: mix(f.nE, z.nE), nW: mix(f.nW, z.nW), dE: mix(f.dE, 0), dW: mix(f.dW, 0), pE: 0, pW: 0, T: mix(f.T, z.T), th: mix(f.th, z.th), boiling: false, flow: 0 };

}
function tour() {
  const age = clock - phaseAt;

  if (phase === "heat") { target = 0.9; if (collected(s) >= 46) go("off"); }
  else if (phase === "off") { target = 0; if (age > 5) { startRefill(); go("refill"); } }

}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) tour();
  power += (target - power) * (1 - Math.exp(-dt / 0.2));

  if (refill) stepRefill(dt); else s = stepStill(s, power, dt);
  animate(dt);
  draw();
  const settled = !touring && !refill && power === target && power === 0 && !s.boiling && s.plate < 30 && Math.abs(s.th - 20) < 0.3 && !live.drips.length && !live.drops.length && !live.bubbles.length && s.pE + s.pW < 1e-4;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function describe() {
  stage.setAttribute("aria-valuenow", String(Math.round(target * 100)));
  stage.setAttribute("aria-valuetext", "Нагрев " + Math.round(target * 100) + " %");
}
function hold() {
  touring = false;
  clearTimeout(idle);
  idle = setTimeout(() => { if (!still.matches) { touring = true; phase = collected(s) >= 46 ? "off" : "heat"; phaseAt = clock; run(); } }, 3600);
}
// under reduced motion the still jumps to where it would settle: boiling at this power, or cold
function calmDraw() {
  if (!still.matches) return;
  power = target;
  live.bubbles = []; live.drops = []; live.drips = [];
  draw();
}
function steer(value) {
  hold();
  target = Math.round(clamp(value, 0, 1) * 100) / 100;

  calmDraw();
  run();
}
function reset() {
  hold();
  if (still.matches) { s = { ...freshStill(), plate: s.plate }; calmDraw(); return; }
  startRefill();
  run();
}
let down = null;
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  if (down && event.pointerType !== "mouse") {
    if (Math.abs(event.clientX - down.x) > 6) down.moved = true;
    steer(down.power + (event.clientX - down.x) / box.width * 1.6);
    return;
  }
  if (event.pointerType === "mouse") {
    if (down && Math.abs(event.clientX - down.x) > 6) down.moved = true;
    steer(((event.clientX - box.left) / box.width - 0.14) / 0.72);
  }
});
stage.addEventListener("pointerdown", (event) => {
  down = { x: event.clientX, power: target, at: performance.now(), moved: false };
  if (event.pointerType !== "mouse") { try { stage.setPointerCapture(event.pointerId); } catch {} }
});

stage.addEventListener("pointerup", release);

  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = from + step;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = from - step;

}
