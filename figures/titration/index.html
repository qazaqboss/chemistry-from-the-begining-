<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Титрование</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.iso{--tt-liquid:#202428;--tt-liquid-top:#292e33;--tt-pink:#c2255c;--tt-pink-top:#d6336c;--tt-lcd:#0b0d0b;--tt-lcd-ink:#d9e6d6;--tt-led:#7ee08a;--tt-bar:#e6e6e6}
.iso[data-theme="light"]{--tt-liquid:#e4e8eb;--tt-liquid-top:#eef1f3;--tt-pink:#e64980;--tt-pink-top:#f06595;--tt-lcd:#dfe4d8;--tt-lcd-ink:#1e231d;--tt-led:#2f9e44;--tt-bar:#ffffff}
.iso-page{width:100%;max-width:820px;margin:0 auto;padding:12px}
html.embed .iso-page{max-width:none}
html.embed{color-scheme:normal}
html.embed,html.embed body{background:transparent;overflow:hidden}
.iso-figure{margin:0}
.iso-stage{touch-action:pan-y;outline:none;cursor:ew-resize;-webkit-tap-highlight-color:transparent}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.tt-edge{fill:none;stroke:var(--anatomy-hi);stroke-width:1.25;stroke-linejoin:round}
.tt-liquid{fill:var(--tt-liquid);stroke:none}
.tt-liquid-top{fill:var(--tt-liquid-top);stroke:none}
.tt-pink{fill:var(--tt-pink);stroke:none}
.tt-pink-top{fill:var(--tt-pink-top)}
.tt-flash{fill:var(--tt-pink-top);stroke:none}
.tt-bar-side{fill:var(--tt-bar);stroke:none;opacity:.85}
.tt-bar-top{fill:var(--tt-bar);stroke:none}
.tt-void{fill:var(--anatomy-shade-0);stroke:none}
.tt-drop{fill:var(--anatomy-hi);stroke:none}
.tt-stream{fill:none;stroke:var(--anatomy-hi);stroke-linecap:round}
.tt-bezel{fill:var(--anatomy-shade-1);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.tt-lcd{fill:var(--tt-lcd);stroke:var(--anatomy-mid);stroke-width:var(--anatomy-weight)}
.tt-lcd-text{fill:var(--tt-lcd-ink);font-family:var(--anatomy-mono);font-variant-numeric:tabular-nums}
.tt-lcd-unit{fill:var(--tt-lcd-ink);opacity:.7;font-family:var(--anatomy-mono)}
.tt-led,.tt-lamp{fill:var(--tt-led);stroke:none}
@media (max-width:560px){.iso-page{padding:6px}.iso-plate{overflow:hidden}.iso-plate .iso-svg{width:112%;margin:-3% -6% -4%}}

`;
{
// Acid–base titration: 25 mL of 0,1 M HCl titrated with 0,1 M NaOH, phenolphthalein as indicator.
// A small pure model: pH from the charge balance, indicator colour from its acid–base equilibrium,
// flow from the stopcock. Everything the figure shows (levels, colour, display, readout) comes from here.

const TIT = {
  acid: 25, // mL of HCl in the flask
  ca: 0.1, // mol/L HCl
  cb: 0.1, // mol/L NaOH in the burette
  kw: 1e-14,
  pKin: 9.4, // phenolphthalein: colourless below about 8,2, crimson above about 10
  scale: 50, // mL, the burette's graduated length
  maxRate: 2.4, // mL/s through the fully open stopcock (figure time)
  drop: 0.05, // mL in one drop
};

const equivalence = () => (TIT.acid * TIT.ca) / TIT.cb;

// pH after `added` mL of base: [H+] − [OH−] = (n(HCl) − n(NaOH)) / V, with [H+][OH−] = Kw.
function phOf(added) {
  const v = (TIT.acid + added) / 1000;
  const d = (TIT.acid * TIT.ca - added * TIT.cb) / 1000 / v;
  const h = (d + Math.sqrt(d * d + 4 * TIT.kw)) / 2;
  return -Math.log10(h);
}

// Share of the indicator in its crimson form; below ~0,05 the eye sees no colour.
function pinkOf(ph) {
  const f = 1 / (1 + Math.pow(10, TIT.pKin - ph));
  return Math.max(0, Math.min(1, (f - 0.03) / 0.8));
}

// Flow through the stopcock for an opening of 0..1 (the key's quarter turn).
const flowOf = (open) => TIT.maxRate * Math.pow(Math.max(0, open), 1.6);

const comma = (value, digits) => value.toFixed(digits).replace(".", ",");
const phText = (ph) => comma(ph, 2);

function readoutOf({ added }) {
  return `добавлено ${comma(added, 2)} мл · pH ${phText(phOf(added))}`;
}

// Cumulative volume table for a body of revolution given as [z, r] knots (r of the inside).
function volumeTable(profile, from, step = 0.25) {
  const radiusAt = (z) => {
    for (let index = 1; index < profile.length; index++) {
      const [z0, r0] = profile[index - 1];
      const [z1, r1] = profile[index];
      if (z <= z1) return r0 + ((r1 - r0) * (z - z0)) / (z1 - z0 || 1);
    }
    return profile[profile.length - 1][1];
  };
  const top = profile[profile.length - 1][0];
  const rows = [[from, 0]];
  let volume = 0;
  for (let z = from; z < top; z += step) {
    const r = radiusAt(z + step / 2);
    volume += Math.PI * r * r * step;
    rows.push([z + step, volume]);
  }
  return rows;
}

function levelFor(table, volume) {
  if (volume <= 0) return table[0][0];
  for (let index = 1; index < table.length; index++) {
    const [z0, v0] = table[index - 1];
    const [z1, v1] = table[index];
    if (volume <= v1) return z0 + ((z1 - z0) * (volume - v0)) / (v1 - v0 || 1);
  }
  return table[table.length - 1][0];
}

const volumeAt = (table, z) => {
  for (let index = 1; index < table.length; index++) {
    const [z0, v0] = table[index - 1];
    const [z1, v1] = table[index];
    if (z <= z1) return v0 + ((v1 - v0) * (z - z0)) / (z1 - z0 || 1);
  }
  return table[table.length - 1][1];
};

// Geometry shared by the build and the page: the numbers that place every part, and the few shapes
// that change while the figure runs (liquid in the burette and the flask, the stopcock key, the stir
// bar). The page inlines this file with its import and export words stripped, so it may only use `iso`.


const RING = 40;

const GEO = {
  azimuth: 60,
  base: { x: -64, y: -62, w: 172, d: 112, r: 6 },
  rod: [0, -48],
  stir: { plan: { x: -30, y: -30, w: 60, d: 60, r: 5 }, z0: 3, z1: 26, top: 28, front: 30 },
  flask: { c: [0, -1], z: 28, lip: 89 },
  bar: { half: 6.6, r: 1.25, z: 29.6 },
  burette: { c: [0, 2.5], rOut: 4.2, rIn: 3.4, glass: [112, 258], zero: 246, ml: 2.6, cock: 103, tip: 92.5 },
  cock: { z: 103, r: 3, front: 6, half: 6.4, wide: 1.2, thick: 1.3 },
  electrode: { c: [4.2, -4], r: 2.1, bulb: 2.5, top: 130, holder: 118 },
  clamp: 196,
  meter: { plan: { x: 50, y: -14, w: 46, d: 40, r: 3 }, z0: 2, z1: 24, front: 26 },
  bnc: [86, -4],
};

// Outside of the 100 mL conical flask as lathe knots [z above its base, r], and its inside.
const FLASK_OUT = [
  [0, 0],
  [0, 25.4],
  [0.6, 26.6],
  [1.8, 27.3],
  [3.4, 27.4],
  [40, 9.8],
  [42.6, 8.6],
  [44.6, 8.4],
  [59, 8.4],
  [59, 0],
];
const FLASK_INSIDE = [
  [0.9, 0.01],
  [1, 25.2],
  [3.2, 26.5],
  [39.8, 9],
  [42.4, 7.8],
  [59, 7.6],
];
const BURETTE_INSIDE = [
  [GEO.burette.glass[0] - 4, 1.1],
  [GEO.burette.glass[0], GEO.burette.rIn],
  [GEO.burette.glass[1], GEO.burette.rIn],
];

const r1 = (value) => Math.round(value * 10) / 10;
function elPath(points, closed = false) {
  if (!points.length) return "";
  return "M" + points.map(([x, y]) => `${r1(x)} ${r1(y)}`).join("L") + (closed ? "Z" : "");
}

function elHull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (sorted.length < 3) return sorted;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const point of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0) lower.pop();
    lower.push(point);
  }
  const upper = [];
  for (let index = sorted.length - 1; index >= 0; index--) {
    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0) upper.pop();
    upper.push(point);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];

function ringAt(cx, cy, r, z, P, from = 0, to = Math.PI * 2, n = RING, closed = true) {
  const out = [];
  const count = closed ? n : n + 1;
  for (let j = 0; j < count; j++) {
    const t = from + ((to - from) * j) / n;
    out.push(iso([cx + r * Math.cos(t), cy + r * Math.sin(t), z], P));
  }
  return out;
}

function radiusIn(profile, z) {
  for (let index = 1; index < profile.length; index++) {
    const [z0, a] = profile[index - 1];
    const [z1, b] = profile[index];
    if (z <= z1) return a + ((b - a) * (z - z0)) / (z1 - z0 || 1);
  }
  return profile[profile.length - 1][1];
}

// The liquid below `level` (profile z measured from `base`): one convex frustum per profile band.
function waterPath(cx, cy, profile, level, P, base = 0) {
  const parts = [];
  for (let index = 1; index < profile.length; index++) {
    const [z0raw] = profile[index - 1];
    if (z0raw >= level) break;
    const z0 = z0raw;
    const z1 = Math.min(profile[index][0], level);
    const a = radiusIn(profile, z0);
    const b = radiusIn(profile, z1);
    parts.push(elPath(elHull([...ringAt(cx, cy, a, base + z0, P), ...ringAt(cx, cy, b, base + z1, P)]), true));
  }
  return parts.join("");
}

function surfaceOf(cx, cy, profile, level, P, base = 0) {
  const r = radiusIn(profile, level);
  const a = (GEO.azimuth * Math.PI) / 180;
  const z = base + level;
  return {
    top: elPath(ringAt(cx, cy, r, z, P), true),
    front: elPath(ringAt(cx, cy, r, z, P, a - Math.PI / 2, a + Math.PI / 2, 24, false)),
    back: elPath(ringAt(cx, cy, r, z, P, a + Math.PI / 2, a + Math.PI * 1.5, 24, false)),
  };
}

const buretteLevel = (used) => GEO.burette.zero - used * GEO.burette.ml;

// The stopcock key: a flat paddle on the front of the barrel, across the tube when shut, along it when open.
function keyOf(turn, P) {
  const c = GEO.cock;
  const [cx, cy] = GEO.burette.c;
  const s = Math.sin(turn);
  const q = Math.cos(turn);
  const corners = (y) =>
    [
      [-c.half, -c.wide],
      [c.half, -c.wide],
      [c.half, c.wide],
      [-c.half, c.wide],
    ].map(([u, v]) => iso([cx + u * q - v * s, y, c.z + u * s + v * q], P));
  const back = corners(cy + c.front);
  const face = corners(cy + c.front + c.thick);
  return { fill: elPath(elHull([...back, ...face]), true), face: elPath(face, true) };
}

// The stir bar: a PTFE capsule lying on the bottom, turned by `angle`.
function barOf(angle, P) {
  const b = GEO.bar;
  const [cx, cy] = GEO.flask.c;
  const ring = [];
  for (let i = 0; i <= 10; i++) {
    const t = -Math.PI / 2 + (Math.PI * i) / 10;
    ring.push([b.half - b.r + Math.cos(t) * b.r, Math.sin(t) * b.r]);
  }
  for (let i = 0; i <= 10; i++) {
    const t = Math.PI / 2 + (Math.PI * i) / 10;
    ring.push([-b.half + b.r + Math.cos(t) * b.r, Math.sin(t) * b.r]);
  }
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  const at = (z) => ring.map(([u, v]) => iso([cx + u * c - v * s, cy + u * s + v * c, z], P));
  const top = at(b.z + b.r * 1.6);
  const all = [...at(b.z), ...top];
  return { fill: elPath(elHull(all), true), top: elPath(top, true) };
}

const P = {"origin":[263.9023993444012,440.7708232218599],"scale":1.2940747232914431,"azimuth":60,"elevation":30};
const START = {"added":18,"open":0.6,"angle":0.4};
const FZ = 28;
const TABLE = volumeTable(FLASK_INSIDE, FLASK_INSIDE[0][0]);
const PER_ML = 440.2973113991956;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sol = { water: part("sol"), pink: part("sol-pink"), top: part("sol-top"), topPink: part("sol-top-pink"), front: part("sol-front"), back: part("sol-back") };
const bur = { water: part("bur"), top: part("bur-top"), front: part("bur-front"), back: part("bur-back") };
const key = part("key"), bar = part("bar"), lcd = part("lcd"), flash = part("flash"), stream = part("stream");
const dropDots = [...part("drops").children];
const [FX, FY] = GEO.flask.c;
const [BX, BY] = GEO.burette.c;

const s = { added: START.added, open: START.open, target: START.open, turn: START.open * Math.PI / 2, angle: START.angle, flash: 0, refill: null };
let drops = [], dropAcc = 0, solLevel = 0;
const drawn = {};
function drawLiquids() {
  const k = s.added.toFixed(3);
  if (drawn.added === k) return;
  drawn.added = k;
  solLevel = levelFor(TABLE, (TIT.acid + s.added) * PER_ML);
  const body = waterPath(FX, FY, FLASK_INSIDE, solLevel, P, FZ);
  const f = surfaceOf(FX, FY, FLASK_INSIDE, solLevel, P, FZ);
  sol.water.setAttribute("d", body); sol.pink.setAttribute("d", body);
  sol.top.setAttribute("d", f.top); sol.topPink.setAttribute("d", f.top); sol.front.setAttribute("d", f.front); sol.back.setAttribute("d", f.back);
  const pink = (pinkOf(phOf(s.added)) * 0.88).toFixed(3);
  sol.pink.style.opacity = pink; sol.topPink.style.opacity = pink;
  const lv = buretteLevel(s.added);
  const g = surfaceOf(BX, BY, BURETTE_INSIDE, lv, P);
  bur.water.setAttribute("d", waterPath(BX, BY, BURETTE_INSIDE, lv, P));
  bur.top.setAttribute("d", g.top); bur.front.setAttribute("d", g.front); bur.back.setAttribute("d", g.back);
  lcd.textContent = phText(phOf(s.added));
}
function drawKey() {
  const k = s.turn.toFixed(3);
  if (drawn.turn === k) return;
  drawn.turn = k;
  const shape = keyOf(s.turn, P);
  const [fill, top, crease, edge] = key.children;
  fill.setAttribute("d", shape.fill); top.setAttribute("d", shape.face); crease.setAttribute("d", shape.face); edge.setAttribute("d", shape.fill);
}
function drawBar() {
  const shape = barOf(s.angle, P);
  const [side, top, edge] = bar.children;
  side.setAttribute("d", shape.fill); top.setAttribute("d", shape.top); edge.setAttribute("d", shape.fill);
}
function draw() {
  drawLiquids();
  drawKey();
  drawBar();
  const surfaceZ = FZ + solLevel;
  const rate = flowOf(s.open);
  if (rate > 0.7 && !s.refill) {
    stream.setAttribute("d", elPath([iso([BX, BY, GEO.burette.tip], P), iso([BX, BY, surfaceZ], P)]));
    stream.style.opacity = clamp((rate - 0.7) / 0.6, 0, 1).toFixed(2);
    stream.style.strokeWidth = (0.5 + rate * 0.35).toFixed(2);
  } else stream.style.opacity = "0";
  dropDots.forEach((el, i) => {
    const d = drops[i];
    if (!d) { if (el.getAttribute("r") !== "0") el.setAttribute("r", "0"); return; }
    const [x, y] = iso([BX, BY, d.z], P);
    el.setAttribute("cx", x.toFixed(1)); el.setAttribute("cy", y.toFixed(1)); el.setAttribute("r", (d.r * P.scale * 1.26).toFixed(2));
  });
  if (s.flash > 0.01) {
    flash.setAttribute("d", elPath(ringAt(BX, BY, 2 + (1 - s.flash) * 6, surfaceZ, P, 0, Math.PI * 2, 28), true));
    flash.style.opacity = (s.flash * 0.85).toFixed(2);
  } else if (flash.style.opacity !== "0") flash.style.opacity = "0";
  const text = readoutOf(s);
  if (readout.textContent !== text) readout.textContent = text;
}

// ---- tour, input, loop
let touring = !still.matches, phase = "fast", phaseAt = 0, clock = 0, idle = 0, frame = 0, last = 0, visible = false;
function startRefill() { s.refill = { from: s.added, t: 0 }; s.target = 0; }
function tour() {

  const go = (next) => { phase = next; phaseAt = clock; };
  const eq = equivalence();
  if (phase === "fast") { s.target = 0.9; if (s.added >= eq - 5) go("slow"); }
  else if (phase === "slow") { s.target = 0.42; if (s.added >= eq - 1.2) go("drop"); }
  else if (phase === "drop") { s.target = 0.2; if (s.added >= eq + 0.25) go("hold"); }
  else if (phase === "hold") { s.target = 0; if (age > 4) { startRefill(); go("refill"); } }
  else if (phase === "refill") { if (!s.refill && age > 2.6) go("fast"); }
}
function tick(now) {

  if (Math.abs(s.target - s.open) < 0.002) s.open = s.target;
  const want = s.open * Math.PI / 2;
  s.turn += (want - s.turn) * (1 - Math.exp(-dt / 0.08));
  if (Math.abs(want - s.turn) < 0.002) s.turn = want;

    s.refill.t = Math.min(1, s.refill.t + dt / 1.6);
    s.added = s.refill.from * Math.pow(1 - s.refill.t, 3);
    if (s.refill.t >= 1) { s.added = 0; s.refill = null; }

    const room = TIT.scale - s.added;
    s.added = Math.min(TIT.scale, s.added + rate * dt);

    while (dropAcc >= 1) { dropAcc -= 1; if (drops.length < dropDots.length && rate < 1.1) drops.push({ z: GEO.burette.tip - 1, v: 0, r: 0.6 }); }

  for (const d of drops) { d.v += 300 * dt; d.z -= d.v * dt; d.r = Math.min(0.95, d.r + dt * 3); }

const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
function describe() {

  clearTimeout(idle);

// under reduced motion nothing flows: the controls set the added volume directly and the figure redraws once

}
let down = null;
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
