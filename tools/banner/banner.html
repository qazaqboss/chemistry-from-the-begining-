<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Manrope, sans-serif; color: #e8ecf8;
    background: radial-gradient(900px 600px at 85% 30%, rgba(110,168,255,.28), transparent 60%),
                radial-gradient(700px 500px at 10% 100%, rgba(155,123,255,.30), transparent 60%),
                linear-gradient(160deg, #0b1124 0%, #0a0e1c 55%, #120d2b 100%); position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(160,180,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(160,180,255,.06) 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(90deg, #000 0%, transparent 70%); }
  .left { position: absolute; left: 72px; top: 78px; width: 640px; }
  .tag { display: inline-flex; gap: 10px; align-items: center; padding: 8px 16px; border-radius: 999px; background: rgba(110,168,255,.14); border: 1px solid rgba(110,168,255,.35); font-weight: 700; font-size: 20px; color: #b9d2ff; }
  h1 { font-size: 92px; line-height: 1.0; font-weight: 800; letter-spacing: -2px; margin-top: 26px; }
  h1 span { background: linear-gradient(90deg, #6ea8ff, #9b7bff 55%, #ff7aa8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { max-width: 590px; font-size: 27px; line-height: 1.4; color: #aab3cf; margin-top: 22px; font-weight: 500; }
  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chip { padding: 9px 13px; border-radius: 13px; background: rgba(255,255,255,.06); border: 1px solid rgba(160,180,255,.18); font-weight: 700; font-size: 19px; white-space: nowrap; }
  .chip b { color: #6ea8ff; }
  .atom { position: absolute; right: 40px; top: 40px; width: 560px; height: 560px; }
  .tiles { position: absolute; right: 70px; bottom: 54px; display: flex; gap: 12px; }
  .el { width: 92px; height: 104px; border-radius: 14px; padding: 9px 11px; background: color-mix(in srgb, var(--c) 22%, #10162c); border: 2px solid color-mix(in srgb, var(--c) 70%, transparent); display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .el .n { font: 700 16px "JetBrains Mono"; opacity: .8; }
  .el .s { font-size: 40px; font-weight: 800; line-height: 1.05; }
  .el .nm { font-size: 14px; color: #c8d0ea; }
</style></head><body>
<div class="grid"></div>
<svg class="atom" viewBox="0 0 560 560">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#6ea8ff" stop-opacity=".45"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" x2="1"><stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient>
    <radialGradient id="p" cx=".35" cy=".35"><stop offset="0" stop-color="#ff9aa8"/><stop offset="1" stop-color="#d83a55"/></radialGradient>
    <radialGradient id="nn" cx=".35" cy=".35"><stop offset="0" stop-color="#e3e8f5"/><stop offset="1" stop-color="#7f8bab"/></radialGradient>
    <radialGradient id="e" cx=".35" cy=".35"><stop offset="0" stop-color="#d8f6ff"/><stop offset="1" stop-color="#2bb8f0"/></radialGradient>
  </defs>
  <circle cx="280" cy="280" r="270" fill="url(#glow)"/>
  <g fill="none" stroke="url(#orb)" stroke-width="3.2" opacity=".9">
    <ellipse cx="280" cy="280" rx="235" ry="88"/>
    <ellipse cx="280" cy="280" rx="235" ry="88" transform="rotate(60 280 280)"/>
    <ellipse cx="280" cy="280" rx="235" ry="88" transform="rotate(120 280 280)"/>
  </g>
  <g>
    <circle cx="262" cy="268" r="17" fill="url(#p)"/><circle cx="294" cy="262" r="17" fill="url(#nn)"/>
    <circle cx="278" cy="292" r="17" fill="url(#nn)"/><circle cx="300" cy="292" r="17" fill="url(#p)"/>
    <circle cx="258" cy="296" r="17" fill="url(#p)"/><circle cx="280" cy="250" r="17" fill="url(#p)"/>
  </g>
  <circle cx="515" cy="280" r="13" fill="url(#e)"/>
  <circle cx="162" cy="96" r="13" fill="url(#e)"/>
  <circle cx="45" cy="280" r="13" fill="url(#e)"/>
</svg>
<div class="left">
  <span class="tag">⚗️ Интерактивный курс · детям и взрослым</span>
  <h1>Химия<br><span>с нуля</span></h1>
  <p>Таблица Менделеева, 3D‑атомы и молекулы в разрезе, опыты, тесты и голосовой гид, который всё покажет сам.</p>
  <div class="chips">
    <span class="chip"><b>118</b> элементов</span>
    <span class="chip"><b>14</b> уроков</span>
    <span class="chip">3D‑модели</span>
    <span class="chip">🔊 гид с голосом</span>
  </div>
</div>
<div class="tiles">
  <div class="el" style="--c:#ffd43b"><span class="n">26</span><span class="s">Fe</span><span class="nm">Железо</span></div>
  <div class="el" style="--c:#4dabf7"><span class="n">8</span><span class="s">O</span><span class="nm">Кислород</span></div>
  <div class="el" style="--c:#4dabf7"><span class="n">6</span><span class="s">C</span><span class="nm">Углерод</span></div>
  <div class="el" style="--c:#ff6b6b"><span class="n">11</span><span class="s">Na</span><span class="nm">Натрий</span></div>
</div>
</body></html>
